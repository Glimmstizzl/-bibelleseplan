<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Bibelleseplan</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f4f5;--card:#fff;--text:#151515;--muted:#777;--line:#e7e7e8;--accent:#111;--soft:#ededed;--done:#eaf6ec}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(244,244,245,.94);backdrop-filter:blur(18px);padding:calc(18px + env(safe-area-inset-top)) 16px 14px;border-bottom:1px solid var(--line)}
h1{font-size:27px;line-height:1.05;margin:0;font-weight:750;letter-spacing:-.6px}
.sub{font-size:13px;color:var(--muted);margin-top:5px}
.progressWrap{margin-top:17px;background:#dedee1;height:9px;border-radius:99px;overflow:hidden}
.progress{height:100%;width:0;background:#111;border-radius:99px;transition:width .25s}
.stats{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;font-weight:600}
main{max-width:700px;margin:auto;padding:16px 13px 90px}
.todayCard{background:#111;color:#fff;border-radius:20px;padding:17px;margin-bottom:16px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
.todayLabel{font-size:12px;opacity:.65;text-transform:uppercase;letter-spacing:.7px}
.todayReading{font-size:20px;font-weight:700;margin:5px 0 13px}
.todayBtn{border:0;background:#fff;color:#111;border-radius:12px;padding:10px 14px;font-weight:650;font-size:14px}
.section{margin:22px 2px 8px;font-size:19px;font-weight:750;letter-spacing:-.3px}
.monthGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}
.week{font-size:10px;text-align:center;color:#999;padding:2px 0 5px}
.calDay{aspect-ratio:1;border:0;background:transparent;border-radius:11px;font-size:12px;font-weight:600;position:relative}
.calDay.empty{visibility:hidden}
.calDay.has{background:#f0f0f1}
.calDay.done{background:#111;color:#fff}
.calDay.today{outline:2px solid #111;outline-offset:1px}
.listHeader{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 8px}
.filter{display:flex;gap:6px}
.filter button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-size:12px}
.filter button.active{background:#111;color:#fff;border-color:#111}
.day{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 12px;margin:7px 0;transition:.15s}
.day.done{background:var(--done);border-color:#d6ead9}
.day input{width:24px;height:24px;flex:0 0 auto;accent-color:#111}
.info{min-width:0;flex:1}
.date{font-size:11px;color:var(--muted);margin-bottom:3px}
.reading{font-size:16px;line-height:1.3;font-weight:560}
.daynum{font-size:11px;color:#aaa;white-space:nowrap}
.emptyState{text-align:center;color:var(--muted);padding:30px 10px}
footer{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.94);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:10px 13px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
footer button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:13px;font-weight:650}
footer .primary{background:#111;color:#fff;border-color:#111}
@media(max-width:420px){.reading{font-size:15px}.daynum{display:none}}
</style>
</head>
<body>
<header>
<h1>📖 Bibelleseplan</h1>
<div class="sub">18.09.2026 – 17.09.2027 · 365 Tage</div>
<div class="progressWrap"><div class="progress" id="progress"></div></div>
<div class="stats"><span id="stats">0 von 365 Tagen</span><span id="percent">0 %</span></div>
</header>

<main>
<div class="todayCard">
  <div class="todayLabel">Heute</div>
  <div class="todayReading" id="todayReading">–</div>
  <button class="todayBtn" onclick="checkToday()">✓ Heutigen Tag abhaken</button>
</div>

<div class="section">Jahresübersicht</div>
<div id="calendar"></div>

<div class="listHeader">
  <div class="section" style="margin:0">Lesungen</div>
  <div class="filter">
    <button id="allBtn" class="active" onclick="setFilter('all')">Alle</button>
    <button id="openBtn" onclick="setFilter('open')">Offen</button>
    <button id="doneBtn" onclick="setFilter('done')">Erledigt</button>
  </div>
</div>
<div id="list"></div>
</main>

<footer>
<button onclick="jumpToToday()">Heute</button>
<button class="primary" onclick="markLastAsDone()">✓ Letzten Stand</button>
</footer>

const KEY="bibelleseplan-premium-18-09-2026";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");
let filter="all";
const start=new Date(2026,8,18);

function save(){localStorage.setItem(KEY,JSON.stringify(state));render();}
function isDone(n){return !!state[n];}
function toggle(n){state[n]=!state[n];save();}
function currentDayIndex(){
 const now=new Date();
 const a=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const b=new Date(2026,8,18);
 return Math.floor((a-b)/86400000)+1;
}
function checkToday(){
 const n=currentDayIndex();
 if(n>=1&&n<=365){state[n]=true;save();document.getElementById("day-"+n)?.scrollIntoView({behavior:"smooth",block:"center"});}
 else alert("Heute liegt außerhalb deines Bibelleseplans.");
}
function jumpToToday(){
 const n=currentDayIndex();
 if(n>=1&&n<=365) document.getElementById("day-"+n)?.scrollIntoView({behavior:"smooth",block:"center"});
 else window.scrollTo({top:0,behavior:"smooth"});
}
function markLastAsDone(){
 const done=Object.keys(state).filter(k=>state[k]).map(Number).sort((a,b)=>a-b);
 const n=(done.length?done[done.length-1]:0)+1;
 if(n<=365){state[n]=true;save();document.getElementById("day-"+n)?.scrollIntoView({behavior:"smooth",block:"center"});}
}
function setFilter(f){filter=f;document.getElementById("allBtn").classList.toggle("active",f==="all");document.getElementById("openBtn").classList.toggle("active",f==="open");document.getElementById("doneBtn").classList.toggle("active",f==="done");renderList();}

function render(){
 const done=rows.filter(x=>isDone(x.day)).length;
 document.getElementById("stats").textContent=done+" von 365 Tagen";
 document.getElementById("percent").textContent=Math.round(done/365*100)+" %";
 document.getElementById("progress").style.width=(done/365*100)+"%";
 const n=currentDayIndex();
 document.getElementById("todayReading").textContent=(n>=1&&n<=365)?rows[n-1].reading:"Plan abgeschlossen";
 renderCalendar();
 renderList();
}

function renderCalendar(){
 const container=document.getElementById("calendar"); container.innerHTML="";
 const months=[];
 for(let i=0;i<12;i++){
   const d=new Date(2026,8+i,1);
   months.push(d);
 }
 months.forEach(m=>{
   const y=m.getFullYear(), mo=m.getMonth();
   const title=document.createElement("div"); title.className="section"; title.textContent=m.toLocaleDateString("de-DE",{month:"long",year:"numeric"});
   container.appendChild(title);
   const grid=document.createElement("div"); grid.className="monthGrid";
   ["Mo","Di","Mi","Do","Fr","Sa","So"].forEach(w=>{let e=document.createElement("div");e.className="week";e.textContent=w;grid.appendChild(e);});
   let first=(m.getDay()+6)%7;
   for(let i=0;i<first;i++){let e=document.createElement("button");e.className="calDay empty";grid.appendChild(e);}
   let days=new Date(y,mo+1,0).getDate();
   for(let day=1;day<=days;day++){
     const d=new Date(y,mo,day);
     const n=Math.floor((d-start)/86400000)+1;
     let e=document.createElement("button");e.className="calDay"+(n>=1&&n<=365?" has ":"");
     if(n>=1&&n<=365&&isDone(n))e.classList.add("done");
     if(n===currentDayIndex())e.classList.add("today");
     e.textContent=day;
     if(n>=1&&n<=365)e.onclick=()=>document.getElementById("day-"+n)?.scrollIntoView({behavior:"smooth",block:"center"});
     grid.appendChild(e);
   }
   container.appendChild(grid);
 });
}

function renderList(){
 const list=document.getElementById("list");
 const filtered=rows.filter(x=>filter==="all"|| (filter==="done"?isDone(x.day):!isDone(x.day)));
 if(!filtered.length){list.innerHTML='<div class="emptyState">Keine Einträge in dieser Ansicht.</div>';return;}
 list.innerHTML=filtered.map(x=>`
 <label class="day ${isDone(x.day)?"done":""}" id="day-${x.day}">
  <input type="checkbox" ${isDone(x.day)?"checked":""} onchange="toggle(${x.day})">
  <div class="info"><div class="date">${x.date}</div><div class="reading">${escapeHtml(x.reading)}</div></div>
  <div class="daynum">Tag ${x.day}</div>
 </label>`).join("");
}

function escapeHtml(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");}
render();
